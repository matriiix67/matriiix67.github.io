<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>技术支持 — 小画本 (Little Artbook)</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#fbf8f1;color:#342b23;line-height:1.8;margin:0}main{max-width:760px;margin:48px auto;padding:32px;background:white;border-radius:20px}a{color:#98602d}h1,h2{line-height:1.3}nav{margin-bottom:28px}p{margin:1em 0}@media(max-width:600px){main{margin:0;padding:24px;border-radius:0}}</style></head><body><main><nav><a href="/xiaohuaben/privacy/">隐私</a> · <a href="/xiaohuaben/support/">支持</a> · <a href="/xiaohuaben/support/en/">English</a></nav><h1>小画本技术支持</h1><section><h2>联系我们</h2><p>使用中遇到问题或有建议，请发邮件至 <a href="mailto:matriiix67@gmail.com">matriiix67@gmail.com</a>。请附上设备型号、系统版本及操作步骤；分享画作和截图前请自行检查其中的个人信息。</p></section><section><h2>购买和恢复</h2><p>会员购买由 Apple 处理。在应用的会员页面选择“恢复购买”，即可使用当前 Apple 账户恢复有效购买。订阅可在设备的 Apple 账户订阅设置中管理。</p></section><section><h2>iCloud 同步</h2><p>在设备系统设置中检查 iCloud 登录状态和小画本的 iCloud 权限。同步速度会受网络和 iCloud 状态影响。</p></section><section><h2>隐私政策</h2><p>请查看本网站的小画本隐私政策。</p></section></main></body></html>
