  <h1>朝读夕拾支持与反馈</h1>

  <h2>联系方式</h2>
  <p>邮箱：<a href="mailto:matriiix67@163.com">matriiix67@163.com</a></p>
  <p>反馈时建议附上设备型号、iOS 版本、App 版本、问题步骤和截图。</p>

  <h2>恢复购买</h2>
  <p>进入“设置 → 升级 Pro”，点击“恢复购买”。</p>

  <h2>iCloud 同步</h2>
  <p>确认设备已登录 iCloud、当前方案包含同步权益，并在设置中开启 iCloud 同步。</p>

  <h2>朗读</h2>
  <p>应用使用设备系统语音朗读英文内容。语音可用性和发音效果由当前设备的系统语音资源决定。</p>
